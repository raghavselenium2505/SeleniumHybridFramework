# ROOT LOGGER
log4j.rootLogger=INFO, CONSOLE, R, HTML, TTCC, CSV

# LOGGER
log4j.logger.devpinoyLogger=INFO

# ================= CONSOLE =================
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c - %m%n
log4j.appender.CONSOLE.ImmediateFlush=true

# ================= TEXT FILE =================
log4j.appender.R=org.apache.log4j.RollingFileAppender
log4j.appender.R.File=src/test/resources/Reports/textFile/TEXTFILE_${current.date.time}.txt
log4j.appender.R.MaxFileSize=10MB
log4j.appender.R.MaxBackupIndex=10
log4j.appender.R.Append=true

log4j.appender.R.layout=org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c - %m%n

# ================= LOG FILE =================
log4j.appender.TTCC=org.apache.log4j.RollingFileAppender
log4j.appender.TTCC.File=src/test/resources/Reports/logFile/LOGFILE_${current.date.time}.log
log4j.appender.TTCC.MaxFileSize=10MB
log4j.appender.TTCC.MaxBackupIndex=10
log4j.appender.TTCC.Append=true

log4j.appender.TTCC.layout=org.apache.log4j.TTCCLayout
log4j.appender.TTCC.layout.DateFormat=ISO8601

# ================= HTML REPORT =================
log4j.appender.HTML=org.apache.log4j.FileAppender
log4j.appender.HTML.File=src/test/resources/Reports/htmlFile/HTMLFILEREPORT_${current.date.time}.html
log4j.appender.HTML.Append=true

log4j.appender.HTML.layout=org.apache.log4j.HTMLLayout
log4j.appender.HTML.layout.Title=SeleAPI Automation Report
log4j.appender.HTML.layout.LocationInfo=true

# ================= CSV REPORT =================
log4j.appender.CSV=org.apache.log4j.FileAppender
log4j.appender.CSV.File=src/test/resources/Reports/xlsFile/XLSFILEREPORT_${current.date.time}.csv
log4j.appender.CSV.Append=true

log4j.appender.CSV.layout=org.apache.log4j.PatternLayout
log4j.appender.CSV.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss},%p,%c,%m%n