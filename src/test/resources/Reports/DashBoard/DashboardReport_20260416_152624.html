<html><head><title>Automation Dashboard</title><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><style>body{font-family:Segoe UI;background:#0f172a;color:white;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}.card{background:#1e293b;padding:20px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,0.4);text-align:center;transition:0.3s}.card:hover{transform:scale(1.03)}.card h2{margin:0;font-size:28px}.card p{color:#94a3b8}.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.btn{background:#22c55e;padding:10px 20px;border:none;border-radius:8px;color:black;cursor:pointer}</style></head><body><h1>🚀 Automation Dashboard</h1><div class='grid'><div class='card'><p>Pass %</p><h2 style='color:#22c55e'>100.000%</h2></div><div class='card'><p>Total Tests</p><h2>1</h2></div><div class='card'><p>Failures</p><h2 style='color:#ef4444'>0</h2></div><div class='card'><p>Execution Time</p><h2>29605556:24</h2></div></div><div class='charts'><div class='card'><h3>Test Distribution</h3><canvas id='pie'></canvas></div><div class='card'><h3>Success Rate</h3><canvas id='gauge'></canvas></div><div class='card'><h3>Execution Trend</h3><canvas id='line'></canvas></div></div><br><button class='btn' onclick="window.open('https://raghav-automation-reports.s3.ap-southeast-2.amazonaws.com/reports/latest/DashboardReport_20260416_152622.html','_blank')">Open Full Report</button><script>new Chart(document.getElementById('pie'),{type:'doughnut',data:{labels:['Passed','Failed','Skipped'],datasets:[{data:[1,0,0],backgroundColor:['#22c55e','#ef4444','#facc15']}]} });new Chart(document.getElementById('gauge'),{type:'doughnut',data:{datasets:[{data:[1,0],backgroundColor:['#22c55e','#374151']}]},options:{rotation:-90,circumference:180,plugins:{legend:{display:false}}}});new Chart(document.getElementById('line'),{type:'line',data:{labels:['Run1','Run2','Run3','Run4'],datasets:[{label:'Execution Time',data:[5,7,4,6],borderColor:'#38bdf8',fill:false}]}});</script></body></html>
